<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>WhatsApp · Vista Conecte</title>
<!-- Caixa de entrada do WhatsApp oficial (etapa 2 do atendimento próprio, 19/10/2026).
     Abre dentro da sub-aba WhatsApp do ATENDIMENTO (iframe) e fala com /api/whatsapp.
     Enquanto o Wati estiver ligado: o que a equipe manda daqui sai pelo número oficial, entra
     no histórico da Vi e pausa a Vi 24 h na conversa, mas NÃO aparece na caixa do Wati. -->
<style>
  :root {
    --text: #1E1B2B; --text-sec: #5E5873; --text-ter: #8D88A0;
    --border: rgba(60,50,90,0.12); --surface: #FFFFFF; --fundo: #F6F4F9;
    --escuro: #1E1B2B; --gold: #C4A882; --gold-dark: #9A7A56;
    --vi: #EFE8F7; --cliente: #FFFFFF; --auto: #F1EFE9;
    --verde: #10B981; --ambar: #B45309; --vermelho: #DC2626; --azul: #2563EB;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text); background: transparent; }
  button, input, textarea { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 330px 1fr; height: 100vh; min-height: 480px; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: var(--surface); }
  .lista { display: flex; flex-direction: column; border-right: 1px solid var(--border); min-width: 0; background: #FBFAFD; }
  .lista-topo { padding: 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .aviso { font-size: 11.5px; color: var(--ambar); background: #FFF7E8; border: 1px solid #F5E1B8; border-radius: 10px; padding: 7px 9px; }
  .busca { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
  .itens { overflow-y: auto; flex: 1; }
  .item { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
  .item:hover { background: #F3F0F8; }
  .item.ativo { background: #EAE4F3; }
  .item .nome { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .hora { font-size: 11px; color: var(--text-ter); }
  .item .prev { grid-column: 1 / -1; font-size: 12.5px; color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .chips { grid-column: 1 / -1; display: flex; gap: 5px; }
  .chip { font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 1px 8px; }
  .chip.esperando { background: #DCFCE7; color: #166534; }
  .chip.pausa { background: #F1EFE9; color: var(--gold-dark); }
  .vazio { padding: 24px; text-align: center; color: var(--text-ter); font-size: 13px; }

  .chat { display: flex; flex-direction: column; min-width: 0; background: var(--fundo); }
  .chat-topo { padding: 10px 14px; border-bottom: 1px solid var(--border); background: #fff; display: flex; align-items: center; gap: 10px; min-height: 56px; }
  .chat-topo .t { min-width: 0; }
  .chat-topo .n { font-weight: 700; }
  .chat-topo .s { font-size: 12px; color: var(--text-sec); }
  .voltar { display: none; border: 0; background: none; font-size: 20px; cursor: pointer; padding: 0 6px; }
  .msgs { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .dia { align-self: center; font-size: 11px; color: var(--text-ter); background: #fff; border-radius: 999px; padding: 2px 10px; margin: 8px 0 2px; }
  .b { max-width: min(78%, 560px); padding: 7px 10px 5px; border-radius: 12px; box-shadow: 0 1px 1px rgba(30,27,43,.06); white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
  .b.cliente { align-self: flex-start; background: var(--cliente); border-top-left-radius: 4px; }
  .b.vi { align-self: flex-end; background: var(--vi); border-top-right-radius: 4px; }
  .b.equipe { align-self: flex-end; background: var(--escuro); color: #fff; border-top-right-radius: 4px; }
  .b.auto { align-self: center; background: var(--auto); color: var(--text-sec); font-size: 12px; max-width: 86%; }
  .b .quem { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; opacity: .65; margin-bottom: 2px; }
  .b .rod { font-size: 10.5px; opacity: .6; text-align: right; margin-top: 2px; }
  .b .rod .lido { color: #93C5FD; opacity: 1; }
  .b .falha { color: #FCA5A5; font-weight: 600; }
  .b a { color: inherit; }
  .b img, .b video { max-width: 100%; max-height: 320px; border-radius: 8px; display: block; margin-bottom: 4px; cursor: zoom-in; }
  .b audio { width: 260px; max-width: 100%; display: block; }
  .comp { border-top: 1px solid var(--border); background: #fff; padding: 10px 12px; }
  .comp-linha { display: flex; gap: 8px; align-items: flex-end; }
  .comp textarea { flex: 1; min-width: 0; resize: none; max-height: 160px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 12px; }
  .comp button { border: 0; background: var(--escuro); color: #fff; border-radius: 12px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
  .comp button:disabled { opacity: .45; cursor: default; }
  .comp .nota { font-size: 11.5px; color: var(--text-ter); margin-top: 6px; min-height: 16px; }
  .comp .nota.erro { color: var(--vermelho); }
  .fechada { font-size: 12.5px; color: var(--ambar); background: #FFF7E8; border-radius: 10px; padding: 8px 10px; }
  .placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-ter); text-align: center; padding: 24px; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; border-radius: 0; border: 0; }
    .app.com-chat .lista { display: none; }
    .app:not(.com-chat) .chat { display: none; }
    .voltar { display: block; }
    .b { max-width: 88%; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="lista">
    <div class="lista-topo">
      <div class="aviso">Fase de teste: o Wati continua ligado. O que você mandar daqui sai pelo número oficial e pausa a Vi por 24 horas nessa conversa, mas não aparece no Wati.</div>
      <input id="busca" class="busca" type="search" placeholder="Buscar por nome ou telefone" autocomplete="off">
    </div>
    <div id="itens" class="itens"><div class="vazio">Carregando conversas...</div></div>
  </aside>
  <section class="chat" id="chat">
    <div class="placeholder" id="ph">Escolha uma conversa na lista.</div>
  </section>
</div>

<script>
const API = '/api/whatsapp';
const est = { conversas: new Map(), desdeLista: null, aberta: null, msgs: new Map(), desdeConversa: null, enviando: false };
const $ = id => document.getElementById(id);

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linkar = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
function telBonito(t) {
  const d = String(t || '').replace(/\D/g, '');
  const m = d.match(/^55(\d{2})(\d{4,5})(\d{4})$/);
  return m ? `(${m[1]}) ${m[2]}-${m[3]}` : (d ? '+' + d : '');
}
const dataBR = iso => new Date(iso).toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo' });
const horaBR = iso => new Date(iso).toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit' });
function quandoCurto(iso) {
  if (!iso) return '';
  return dataBR(iso) === dataBR(new Date().toISOString()) ? horaBR(iso) : dataBR(iso).slice(0, 5);
}
const visivel = () => document.visibilityState === 'visible' && (!window.frameElement || window.frameElement.offsetParent !== null);

async function api(params, corpo) {
  const r = corpo
    ? await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo), credentials: 'same-origin' })
    : await fetch(API + '?' + new URLSearchParams(params), { credentials: 'same-origin' });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) throw new Error('Sessão expirada. Entre de novo no painel.');
  if (!r.ok) { const e = new Error(d.detalhe || d.erro || ('erro ' + r.status)); e.codigo = d.erro; throw e; }
  return d;
}

// ── Lista ────────────────────────────────────────────────────────────────────
let buscaAtual = '';
async function carregarLista(completa) {
  const p = { acao: 'conversas' };
  if (buscaAtual) p.busca = buscaAtual;
  else if (!completa && est.desdeLista) p.desde = est.desdeLista;
  try {
    const d = await api(p);
    if (completa || buscaAtual) est.conversas.clear();
    for (const c of d.conversas) est.conversas.set(c.chave, c);
    if (!buscaAtual) {
      const max = d.conversas.reduce((m, c) => (c.ultima_em > m ? c.ultima_em : m), est.desdeLista || '');
      if (max) est.desdeLista = max;
    }
    desenharLista();
    if (est.aberta && est.conversas.has(est.aberta.chave)) { Object.assign(est.aberta, est.conversas.get(est.aberta.chave)); desenharTopo(); }
  } catch (e) {
    if (!est.conversas.size) $('itens').innerHTML = `<div class="vazio">${esc(e.message)}</div>`;
  }
}
function previa(c) {
  const t = String(c.ultimo_texto || '');
  if (t.startsWith('[contexto interno')) return 'Mensagem automática';
  const quem = c.ultima_direcao === 'saida' ? 'Loja: ' : '';
  if (!t && c.ultimo_tipo && c.ultimo_tipo !== 'text') return quem + ({ image: 'Foto', audio: 'Áudio', video: 'Vídeo', document: 'Documento', sticker: 'Figurinha' }[c.ultimo_tipo] || c.ultimo_tipo);
  return quem + t;
}
function desenharLista() {
  const lista = [...est.conversas.values()].sort((a, b) => (a.ultima_em < b.ultima_em ? 1 : -1));
  if (!lista.length) { $('itens').innerHTML = `<div class="vazio">${buscaAtual ? 'Nenhuma conversa encontrada.' : 'Nenhuma conversa ainda.'}</div>`; return; }
  const agora = Date.now();
  $('itens').innerHTML = lista.map(c => {
    const chips = [];
    if (c.ultima_direcao === 'entrada') chips.push('<span class="chip esperando">aguardando</span>');
    if (c.pausada_ate && Date.parse(c.pausada_ate) > agora) chips.push('<span class="chip pausa">Vi pausada</span>');
    return `<div class="item${est.aberta && est.aberta.chave === c.chave ? ' ativo' : ''}" data-chave="${esc(c.chave)}">
      <div class="nome">${esc(c.nome || telBonito(c.telefone))}</div><div class="hora">${quandoCurto(c.ultima_em)}</div>
      <div class="prev">${esc(previa(c))}</div>${chips.length ? `<div class="chips">${chips.join('')}</div>` : ''}</div>`;
  }).join('');
}
$('itens').addEventListener('click', e => {
  const it = e.target.closest('.item');
  if (it) abrir(est.conversas.get(it.dataset.chave));
});
let tBusca;
$('busca').addEventListener('input', e => {
  clearTimeout(tBusca);
  tBusca = setTimeout(() => { buscaAtual = e.target.value.trim(); carregarLista(true); }, 350);
});

// ── Conversa ─────────────────────────────────────────────────────────────────
function abrir(c) {
  if (!c) return;
  est.aberta = { ...c };
  est.msgs.clear();
  est.desdeConversa = null;
  $('app').classList.add('com-chat');
  $('chat').innerHTML = `
    <div class="chat-topo"><button class="voltar" id="voltar" aria-label="Voltar">&#8592;</button><div class="t"><div class="n" id="c-nome"></div><div class="s" id="c-status"></div></div></div>
    <div class="msgs" id="msgs"><div class="vazio">Carregando...</div></div>
    <div class="comp"><div id="c-janela"></div>
      <div class="comp-linha"><textarea id="txt" rows="1" placeholder="Escreva a resposta"></textarea><button id="btn">Enviar</button></div>
      <div class="nota" id="nota">Ao enviar, a Vi para de responder esta cliente por 24 horas.</div></div>`;
  $('voltar').onclick = () => { $('app').classList.remove('com-chat'); est.aberta = null; desenharLista(); };
  $('btn').onclick = enviar;
  $('txt').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } });
  $('txt').addEventListener('input', e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 160) + 'px'; });
  desenharTopo();
  desenharLista();
  carregarConversa();
}
function janelaAberta() {
  const u = est.aberta && est.aberta.ultima_entrada_em;
  return !!u && Date.now() - Date.parse(u) < 24 * 3600e3;
}
function desenharTopo() {
  const c = est.aberta;
  if (!c || !$('c-nome')) return;
  $('c-nome').textContent = c.nome || telBonito(c.telefone);
  const partes = [telBonito(c.telefone)];
  if (c.pausada_ate && Date.parse(c.pausada_ate) > Date.now()) partes.push(`Vi pausada até ${dataBR(c.pausada_ate).slice(0, 5)} ${horaBR(c.pausada_ate)}`);
  else partes.push('Vi atendendo');
  $('c-status').textContent = partes.join(' · ');
  const aberta = janelaAberta();
  $('c-janela').innerHTML = aberta ? '' : '<div class="fechada">A cliente não escreve há mais de 24 horas. Pela regra do WhatsApp, só dá para mandar um template aprovado (ainda não disponível nesta tela).</div>';
  $('txt').disabled = !aberta || est.enviando;
  $('btn').disabled = !aberta || est.enviando;
}
async function carregarConversa() {
  const c = est.aberta;
  if (!c) return;
  const p = { acao: 'conversa', tel: c.telefone };
  if (est.desdeConversa) p.desde = est.desdeConversa;
  try {
    const d = await api(p);
    if (!est.aberta || est.aberta.chave !== c.chave) return;
    if (d.conversa) Object.assign(est.aberta, d.conversa);
    const antes = est.msgs.size;
    const primeira = !est.desdeConversa;
    for (const m of d.mensagens) est.msgs.set(m.id, m);
    est.desdeConversa = d.agora;
    if (primeira || est.msgs.size !== antes || d.mensagens.length) desenharMsgs(primeira);
    desenharTopo();
  } catch (e) {
    if (!est.msgs.size) $('msgs').innerHTML = `<div class="vazio">${esc(e.message)}</div>`;
  }
}
function corpoMidia(m) {
  if (!m.midia_id) return '';
  const src = `${API}?acao=midia&id=${encodeURIComponent(m.midia_id)}`;
  if (m.tipo === 'image' || m.tipo === 'sticker') return `<a href="${src}" target="_blank" rel="noopener"><img src="${src}" loading="lazy" alt="Foto da cliente"${m.tipo === 'sticker' ? ' style="max-width:140px"' : ''}></a>`;
  if (m.tipo === 'audio') return `<audio controls preload="none" src="${src}"></audio>`;
  if (m.tipo === 'video') return `<video controls preload="none" src="${src}"></video>`;
  return `<a href="${src}" target="_blank" rel="noopener">Abrir arquivo${m.texto ? '' : ' enviado pela cliente'}</a>${m.texto ? '<br>' : ''}`;
}
function rodape(m) {
  let s = horaBR(m.quando);
  if (m.lado === 'equipe' && m.status) {
    if (m.status === 'failed') return `<span class="falha">Não entregue${m.erro && m.erro[0] ? ': ' + esc(m.erro[0].title || m.erro[0].message || m.erro[0].code) : ''}</span>`;
    s += ' ' + (m.status === 'read' ? '<span class="lido">&#10003;&#10003;</span>' : m.status === 'delivered' ? '&#10003;&#10003;' : '&#10003;');
  }
  return s;
}
function desenharMsgs(rolar) {
  const box = $('msgs');
  if (!box) return;
  const noFim = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const lista = [...est.msgs.values()].sort((a, b) => Date.parse(a.quando) - Date.parse(b.quando));
  if (!lista.length) { box.innerHTML = '<div class="vazio">Sem mensagens guardadas desta conversa.</div>'; return; }
  let dia = '';
  const html = [];
  for (const m of lista) {
    const d = dataBR(m.quando);
    if (d !== dia) { dia = d; html.push(`<div class="dia">${d}</div>`); }
    if (m.lado === 'auto') {
      const t = String(m.texto || '').replace(/^\[contexto interno:\s*/, '').replace(/\]\s*$/, '');
      html.push(`<div class="b auto"><div class="quem">Mensagem automática</div>${esc(t)}<div class="rod">${horaBR(m.quando)}</div></div>`);
      continue;
    }
    const quem = m.lado === 'vi' ? '<div class="quem">Vi</div>' : m.lado === 'equipe' ? '<div class="quem">Equipe</div>' : '';
    html.push(`<div class="b ${m.lado}">${quem}${corpoMidia(m)}${m.texto ? linkar(m.texto) : (m.midia_id ? '' : '<i>mensagem sem texto</i>')}<div class="rod">${rodape(m)}</div></div>`);
  }
  box.innerHTML = html.join('');
  if (rolar || noFim) box.scrollTop = box.scrollHeight;
}
async function enviar() {
  const txt = $('txt');
  const texto = txt.value.trim();
  if (!texto || est.enviando || !est.aberta) return;
  est.enviando = true;
  desenharTopo();
  $('nota').className = 'nota';
  $('nota').textContent = 'Enviando...';
  try {
    const d = await api(null, { acao: 'enviar', tel: est.aberta.telefone, texto });
    txt.value = '';
    txt.style.height = 'auto';
    est.aberta.pausada_ate = d.vi_pausada_ate;
    est.msgs.set(d.wamid, { id: d.wamid, quando: new Date().toISOString(), lado: 'equipe', texto, tipo: 'text' });
    desenharMsgs(true);
    $('nota').textContent = 'Enviada. A Vi está pausada nesta conversa por 24 horas.';
  } catch (e) {
    $('nota').className = 'nota erro';
    $('nota').textContent = e.message;
  } finally {
    est.enviando = false;
    desenharTopo();
    if (!txt.disabled) txt.focus();
  }
}

// ── Atualização: só enquanto a tela está à vista, e só o que mudou ──────────
carregarLista(true);
setInterval(() => { if (visivel() && !buscaAtual) carregarLista(false); }, 15000);
setInterval(() => { if (visivel() && est.aberta) carregarConversa(); }, 6000);
document.addEventListener('visibilitychange', () => { if (visivel()) { carregarLista(!buscaAtual ? false : true); if (est.aberta) carregarConversa(); } });
</script>
</body>
</html>
