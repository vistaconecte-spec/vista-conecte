<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Vi - atendimento · Vista Conecte</title>
<!-- Caixa de entrada do WhatsApp oficial (etapa 2 do atendimento próprio, 19/10/2026), com a
     cara do WhatsApp Web a pedido da Bárbara. Abre dentro da pílula "Vi - atendimento" do
     ATENDIMENTO (iframe) e fala com /api/whatsapp.
     Enquanto o Wati estiver ligado: o que a equipe manda daqui sai pelo número oficial, entra
     no histórico da Vi e pausa a Vi 24 h na conversa, mas NÃO aparece na caixa do Wati. -->
<style>
  :root {
    --verde: #00A884; --verde-esc: #008069; --verde-bolinha: #25D366; --verde-hora: #1FA855;
    --balao-sai: #D9FDD3; --balao-entra: #FFFFFF; --fundo-chat: #EFEAE2;
    --cinza-barra: #F0F2F5; --cinza-hover: #F5F6F6; --linha: #E9EDEF;
    --texto: #111B21; --texto-sec: #667781; --icone: #54656F; --lido: #53BDEB;
    --aviso: #FFEECD; --nome-vi: #7E57C2; --nome-equipe: #128C7E; --erro: #EA0038;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14.2px/1.4 "Segoe UI", "Helvetica Neue", Helvetica, "Lucida Grande", Arial, sans-serif; color: var(--texto); background: transparent; }
  button, input, textarea { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: minmax(330px, 30%) 1fr; grid-template-rows: minmax(0, 1fr); height: 100vh; min-height: 480px; overflow: hidden; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(11,20,26,.12); }

  /* ── Lista ── */
  .lista { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--linha); background: #fff; }
  .lista-topo { padding: 14px 16px 6px; }
  .titulo { font-size: 22px; font-weight: 700; color: var(--texto); margin: 0 0 12px; }
  .embutida .titulo { display: none; } /* dentro do painel o título fica no topo dele */
  .aviso-teste { font-size: 12px; line-height: 1.35; color: #54656F; background: var(--aviso); border-radius: 8px; padding: 7px 10px; margin-bottom: 10px; }
  .busca { display: flex; align-items: center; gap: 10px; background: var(--cinza-barra); border-radius: 8px; padding: 0 12px; height: 36px; }
  .busca svg { flex: none; color: var(--icone); }
  .busca input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 14px; min-width: 0; }
  .filtros { display: flex; gap: 6px; padding: 10px 0 6px; flex-wrap: wrap; }
  .filtro { border: 0; background: var(--cinza-barra); color: var(--texto-sec); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; cursor: pointer; }
  .filtro.ativo { background: #E7FCE3; color: var(--verde-esc); font-weight: 600; }
  .itens { overflow-y: auto; flex: 1; min-height: 0; }
  .item { display: flex; align-items: center; gap: 13px; padding: 0 0 0 13px; height: 72px; cursor: pointer; }
  .item:hover { background: var(--cinza-hover); }
  .item.ativo { background: var(--cinza-barra); }
  .avatar { flex: none; width: 49px; height: 49px; border-radius: 50%; background: #DFE5E7; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .avatar svg { width: 80%; height: 80%; color: #fff; }
  .avatar.peq { width: 40px; height: 40px; }
  .item-corpo { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; border-bottom: 1px solid var(--linha); padding-right: 15px; }
  .item-l1, .item-l2 { display: flex; align-items: center; gap: 6px; }
  .item-nome { flex: 1; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-hora { font-size: 12px; color: var(--texto-sec); }
  .item-hora.nova { color: var(--verde-hora); font-weight: 600; }
  .item-prev { flex: 1; font-size: 14px; color: var(--texto-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .item-prev .vi { color: var(--nome-vi); }
  .bolinha { flex: none; min-width: 20px; height: 20px; border-radius: 10px; background: var(--verde-bolinha); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
  .tag-pausa { flex: none; font-size: 11px; color: var(--texto-sec); background: var(--cinza-barra); border-radius: 4px; padding: 1px 5px; }
  .vazio { padding: 28px 20px; text-align: center; color: var(--texto-sec); font-size: 14px; }

  /* ── Conversa ── */
  .chat { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--fundo-chat); }
  .chat::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image: radial-gradient(rgba(84,101,111,.10) 1px, transparent 1.2px); background-size: 22px 22px; }
  .chat > * { position: relative; }
  .chat-topo { height: 59px; flex: none; display: flex; align-items: center; gap: 13px; padding: 0 16px; background: var(--cinza-barra); border-left: 1px solid var(--linha); }
  .chat-topo .t { min-width: 0; flex: 1; }
  .chat-topo .n { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-topo .s { font-size: 13px; color: var(--texto-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acoes { flex: none; display: flex; gap: 8px; }
  .acao { border: 1px solid var(--linha); background: #fff; border-radius: 16px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--texto); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .acao:hover { background: #F5F6F6; }
  .acao:disabled { opacity: .5; cursor: default; }
  .acao.vi { color: var(--nome-vi); }
  .acao.ok { color: var(--verde-esc); }
  .tag-resolvida { flex: none; font-size: 11px; color: var(--verde-esc); background: #E7FCE3; border-radius: 4px; padding: 1px 5px; }
  @media (max-width: 760px) { .acao .rot { display: none; } }
  .voltar { display: none; border: 0; background: none; cursor: pointer; padding: 4px; color: var(--icone); }
  .msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 6% 8px; display: flex; flex-direction: column; }
  .dia { align-self: center; margin: 12px 0 8px; padding: 5px 12px; font-size: 12.5px; color: #54656F; background: #fff; border-radius: 7.5px; box-shadow: 0 1px 0.5px rgba(11,20,26,.13); text-transform: uppercase; }
  .b { position: relative; max-width: 65%; padding: 6px 7px 8px 9px; border-radius: 7.5px; box-shadow: 0 1px 0.5px rgba(11,20,26,.13); margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .b.novo-grupo { margin-top: 10px; }
  .b.entra { align-self: flex-start; background: var(--balao-entra); }
  .b.sai { align-self: flex-end; background: var(--balao-sai); }
  .b.cauda.entra { border-top-left-radius: 0; }
  .b.cauda.sai { border-top-right-radius: 0; }
  .b.cauda.entra::before { content: ""; position: absolute; top: 0; left: -8px; border-right: 8px solid var(--balao-entra); border-bottom: 13px solid transparent; }
  .b.cauda.sai::before { content: ""; position: absolute; top: 0; right: -8px; border-left: 8px solid var(--balao-sai); border-bottom: 13px solid transparent; }
  .b .quem { font-size: 12.8px; font-weight: 600; margin-bottom: 1px; }
  .b .quem.vi { color: var(--nome-vi); }
  .b .quem.equipe { color: var(--nome-equipe); }
  .b .meta { float: right; margin: 8px 0 -6px 10px; font-size: 11px; color: var(--texto-sec); white-space: nowrap; line-height: 15px; }
  .b .meta .tique { margin-left: 3px; color: #8696A0; }
  .b .meta .tique.lido { color: var(--lido); }
  .b .falha { color: var(--erro); }
  .b a { color: #027EB5; }
  .b img, .b video { display: block; max-width: 100%; max-height: 330px; border-radius: 6px; margin: -3px -4px 4px -6px; cursor: zoom-in; }
  .b audio { display: block; width: 280px; max-width: 100%; height: 40px; }
  .sistema { align-self: center; max-width: 80%; margin: 10px 0; padding: 6px 12px; font-size: 12.5px; color: #54656F; background: var(--aviso); border-radius: 7.5px; box-shadow: 0 1px 0.5px rgba(11,20,26,.13); text-align: center; white-space: pre-wrap; }
  .sistema b { display: block; font-size: 11.5px; color: var(--texto-sec); margin-bottom: 2px; }
  .descer { position: absolute; right: 18px; bottom: 76px; width: 42px; height: 42px; border-radius: 50%; border: 0; background: #fff; color: var(--icone); box-shadow: 0 1px 3px rgba(11,20,26,.25); cursor: pointer; display: none; align-items: center; justify-content: center; }
  .descer.on { display: flex; }

  .comp { flex: none; background: var(--cinza-barra); padding: 5px 16px 7px; }
  .comp-linha { display: flex; align-items: flex-end; gap: 8px; }
  .comp textarea { flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: #fff; border-radius: 8px; padding: 9px 12px; font-size: 15px; line-height: 20px; max-height: 120px; }
  .enviar { flex: none; width: 42px; height: 42px; border: 0; background: transparent; color: var(--icone); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .enviar:not(:disabled):hover { background: rgba(11,20,26,.05); }
  .enviar:disabled { opacity: .35; cursor: default; }
  .anexo { flex: none; display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 8px; padding: 8px 10px; margin: 0 0 6px 50px; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
  .anexo img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; flex: none; }
  .anexo .doc { width: 56px; height: 56px; border-radius: 6px; background: #E9EDEF; color: var(--icone); display: flex; align-items: center; justify-content: center; flex: none; }
  .anexo .info { flex: 1; min-width: 0; font-size: 14px; }
  .anexo .info b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .anexo .info span { font-size: 12px; color: var(--texto-sec); }
  .anexo .tirar { flex: none; width: 32px; height: 32px; border: 0; background: transparent; color: var(--icone); cursor: pointer; border-radius: 50%; font-size: 20px; line-height: 1; }
  .anexo .tirar:hover { background: rgba(11,20,26,.06); }
  .comp .nota { font-size: 12px; color: var(--texto-sec); padding: 4px 4px 0; min-height: 18px; }
  .comp .nota.erro { color: var(--erro); }
  .fechada { margin: 4px 0 6px; font-size: 13px; color: #54656F; background: var(--aviso); border-radius: 8px; padding: 8px 12px; }
  .fechada .btn-modelo { margin-left: 8px; border: 0; background: var(--verde); color: #fff; border-radius: 16px; padding: 5px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .modelo { background: #fff; border-radius: 8px; padding: 12px 14px; margin: 4px 0 8px; box-shadow: 0 1px .5px rgba(11,20,26,.13); display: grid; gap: 10px; }
  .modelo-topo { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .modelo-topo b { flex: 1; font-weight: 600; }
  .modelo select, .modelo input { width: 100%; border: 1px solid var(--linha); border-radius: 8px; padding: 8px 10px; font-size: 14px; background: #fff; }
  .modelo label { display: grid; gap: 4px; font-size: 12px; color: var(--texto-sec); }
  .modelo .campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
  .modelo-previa { background: #D9FDD3; border-radius: 8px; padding: 9px 12px; font-size: 14px; line-height: 20px; white-space: pre-wrap; max-height: 150px; overflow: auto; }
  .modelo-previa mark { background: #FFF3B0; border-radius: 3px; padding: 0 2px; }
  .modelo-pe { display: flex; align-items: center; gap: 10px; }
  .modelo-pe span { flex: 1; font-size: 12px; color: var(--texto-sec); }
  .modelo-pe button { border: 0; background: var(--verde); color: #fff; border-radius: 18px; padding: 8px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .modelo-pe button:disabled { opacity: .45; cursor: default; }
  .modelo .tirar { width: 32px; height: 32px; border: 0; background: transparent; color: var(--icone); cursor: pointer; border-radius: 50%; font-size: 20px; line-height: 1; }

  .inicio { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: var(--cinza-barra); border-left: 1px solid var(--linha); padding: 30px; color: var(--texto-sec); border-bottom: 6px solid var(--verde); }
  .inicio h2 { font-weight: 300; font-size: 32px; color: #41525D; margin: 18px 0 10px; }
  .inicio p { max-width: 460px; font-size: 14px; line-height: 20px; margin: 0; }
  .inicio .circulo { width: 84px; height: 84px; border-radius: 50%; background: #DFF4EC; color: var(--verde-esc); display: flex; align-items: center; justify-content: center; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; border-radius: 0; box-shadow: none; }
    .app.com-chat .lista { display: none; }
    .app:not(.com-chat) .chat { display: none; }
    .voltar { display: block; }
    .b { max-width: 85%; }
    .msgs { padding: 10px 14px 8px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="lista">
    <div class="lista-topo">
      <h1 class="titulo">Vi - atendimento</h1>
      <div class="aviso-teste">Fase de teste: o Wati continua ligado. Aqui você acompanha as conversas; para responder, use o Wati por enquanto.</div>
      <label class="busca"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="busca" type="search" placeholder="Pesquisar nome ou telefone" autocomplete="off"></label>
      <div class="filtros" id="filtros">
        <button class="filtro ativo" data-f="">Tudo</button>
        <button class="filtro" data-f="aguardando">Aguardando resposta</button>
        <button class="filtro" data-f="pausada">Vi pausada</button>
      </div>
    </div>
    <div id="itens" class="itens"><div class="vazio">Carregando conversas...</div></div>
  </aside>
  <section class="chat" id="chat">
    <div class="inicio">
      <div class="circulo"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg></div>
      <h2>Vi - atendimento</h2>
      <p>As conversas do WhatsApp da loja, direto da Meta. Escolha uma conversa na lista para ler e responder.</p>
    </div>
  </section>
</div>

<script>
const API = '/api/whatsapp';
if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embutida');
const est = { conversas: new Map(), desdeLista: null, aberta: null, msgs: new Map(), desdeConversa: null, enviando: false, filtro: '', envio: false, avisoEnvio: '' };
const $ = id => document.getElementById(id);
const TZ = 'America/Sao_Paulo';
const AVATAR = '<svg viewBox="0 0 212 212"><path fill="currentColor" d="M106 45c-24 0-43 19-43 43s19 43 43 43 43-19 43-43-19-43-43-43zm0 98c-38 0-70 19-81 46 20 14 49 23 81 23s61-9 81-23c-11-27-43-46-81-46z"/></svg>';
const TIQUE = '<svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6l3 3 6-7"/></svg>';
const TIQUE2 = '<svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6l3 3 6-7M7 8l1 1 6-7"/></svg>';

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Texto da mensagem: escapa, vira link, e *negrito* como no WhatsApp.
const formatar = s => esc(s)
  .replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`)
  .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, '$1<strong>$2</strong>');
function telBonito(t) {
  let d = String(t || '').replace(/\D/g, '');
  // A Meta manda o celular sem o 9 (554188238492); na tela vai como a cliente conhece.
  if (d.length === 12 && d.startsWith('55') && /[6-9]/.test(d[4])) d = d.slice(0, 4) + '9' + d.slice(4);
  const m = d.match(/^55(\d{2})(\d{4,5})(\d{4})$/);
  return m ? `+55 ${m[1]} ${m[2]}-${m[3]}` : (d ? '+' + d : '');
}
const diaSP = iso => new Date(iso).toLocaleDateString('en-CA', { timeZone: TZ }); // AAAA-MM-DD
const horaBR = iso => new Date(iso).toLocaleTimeString('pt-BR', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
function diasAtras(iso) {
  const a = Date.parse(diaSP(new Date().toISOString()) + 'T00:00:00Z'), b = Date.parse(diaSP(iso) + 'T00:00:00Z');
  return Math.round((a - b) / 86400e3);
}
const SEMANA = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
function rotuloDia(iso) {
  const n = diasAtras(iso);
  if (n === 0) return 'Hoje';
  if (n === 1) return 'Ontem';
  if (n < 7) return SEMANA[new Date(diaSP(iso) + 'T12:00:00Z').getUTCDay()];
  return new Date(iso).toLocaleDateString('pt-BR', { timeZone: TZ });
}
function horaLista(iso) {
  if (!iso) return '';
  const n = diasAtras(iso);
  if (n === 0) return horaBR(iso);
  if (n === 1) return 'Ontem';
  if (n < 7) return SEMANA[new Date(diaSP(iso) + 'T12:00:00Z').getUTCDay()];
  return new Date(iso).toLocaleDateString('pt-BR', { timeZone: TZ });
}
const visivel = () => document.visibilityState === 'visible' && (!window.frameElement || window.frameElement.offsetParent !== null);
const pausada = c => !!(c && c.pausada_ate && Date.parse(c.pausada_ate) > Date.now());

async function api(params, corpo) {
  const r = corpo
    ? await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo), credentials: 'same-origin' })
    : await fetch(API + '?' + new URLSearchParams(params), { credentials: 'same-origin' });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) throw new Error('Sessão expirada. Entre de novo no painel.');
  if (!r.ok) { const e = new Error(d.detalhe || d.erro || ('erro ' + r.status)); e.codigo = d.erro; throw e; }
  return d;
}

// ── Lista ────────────────────────────────────────────────────────────────────
let buscaAtual = '';
async function carregarLista(completa) {
  const p = { acao: 'conversas' };
  if (buscaAtual) p.busca = buscaAtual;
  if (est.filtro) p.filtro = est.filtro;
  // Com busca ou filtro a lista vem inteira; sem eles, só o que mudou desde a última vez.
  const incremental = !completa && !buscaAtual && !est.filtro && est.desdeLista;
  if (incremental) p.desde = est.desdeLista;
  try {
    const d = await api(p);
    // o servidor diz se o envio pelo painel está ligado (WA_ENVIO_PAINEL); desligado, a caixa vira só leitura
    est.envio = !!d.envio;
    est.avisoEnvio = d.aviso_envio || '';
    if (!incremental) est.conversas.clear();
    for (const c of d.conversas) est.conversas.set(c.chave, c);
    if (!buscaAtual && !est.filtro) {
      const max = d.conversas.reduce((m, c) => (c.ultima_em > m ? c.ultima_em : m), est.desdeLista || '');
      if (max) est.desdeLista = max;
    } else est.desdeLista = null;
    desenharLista();
    if (est.aberta && est.conversas.has(est.aberta.chave)) { Object.assign(est.aberta, est.conversas.get(est.aberta.chave)); desenharTopo(); }
  } catch (e) {
    if (!est.conversas.size) $('itens').innerHTML = `<div class="vazio">${esc(e.message)}</div>`;
  }
}
function previa(c) {
  // a anotação que fica no histórico da Vi quando a equipe manda arquivo vira o ícone, como no WhatsApp
  const t = String(c.ultimo_texto || '').replace(/^\[a equipe mandou uma foto\]\s*/, '📷 ').replace(/^\[a equipe mandou o documento ([^\]]+)\]\s*/, '📄 $1 ');
  if (t.startsWith('[contexto interno')) return 'Mensagem automática da loja';
  if (!t && c.ultimo_tipo && c.ultimo_tipo !== 'text') return ({ image: 'Foto', audio: 'Áudio', video: 'Vídeo', document: 'Documento', sticker: 'Figurinha' }[c.ultimo_tipo] || 'Mensagem');
  return t;
}
function desenharLista() {
  const lista = [...est.conversas.values()].sort((a, b) => (a.ultima_em < b.ultima_em ? 1 : -1));
  if (!lista.length) { $('itens').innerHTML = `<div class="vazio">${buscaAtual || est.filtro ? 'Nenhuma conversa encontrada.' : 'Nenhuma conversa ainda.'}</div>`; return; }

    txt.value = '';
    txt.style.height = 'auto';
    est.aberta.pausada_ate = d.vi_pausada_ate;
    est.msgs.set(d.wamid, { id: d.wamid, quando: new Date().toISOString(), lado: 'equipe', texto, tipo: 'text' });
    desenharMsgs(true);
    $('nota').textContent = 'Enviada. A Vi está pausada nesta conversa por 24 horas.';
  } catch (e) {
    $('nota').className = 'nota erro';
    $('nota').textContent = e.message;
  } finally {
    est.enviando = false;
    desenharTopo();
    if (!txt.disabled) txt.focus();
  }
}
async function enviarComAnexo(legenda) {
  const txt = $('txt');
  est.enviando = true;
  desenharTopo();
  avisar(est.anexo.tipo === 'image' ? 'Enviando a foto...' : 'Enviando o documento...');
  try {
    const d = await enviarAnexo(legenda);
    txt.value = '';
    txt.style.height = 'auto';
    est.aberta.pausada_ate = d.vi_pausada_ate;
    est.msgs.set(d.wamid, { id: d.wamid, quando: new Date().toISOString(), lado: 'equipe', texto: legenda, tipo: d.tipo, midia_id: d.midia_id });
    tirarAnexo();
    desenharMsgs(true);
    avisar('Enviado. A Vi está pausada nesta conversa por 24 horas.');
  } catch (e) {
    avisar(e.message, true);
  } finally {
    est.enviando = false;
    desenharTopo();
    if (!txt.disabled) txt.focus();
  }
}
