name: Renovar acesso do Bling
on:
  # 24/11/2026: a rodada das 8h47 nunca rodou (o GitHub pula ou atrasa agendamento) e o token de 6 h
  # do Bling venceu às 01h56 sem renovar, então nenhuma nota saiu até alguém disparar na mão.
  # Aqui só a renovação, de hora em hora: o script só pede token novo quando falta menos de 1h30,
  # então a maioria das execuções termina em segundos sem mexer em nada.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch: {}
concurrency:
  group: bling-renovar
  cancel-in-progress: false
jobs:
  renovar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/bling-renovar.mjs
        env:
          VC_API_TOKEN: ${{ secrets.VC_API_TOKEN }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
