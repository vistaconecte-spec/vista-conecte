name: Vigia das automações
on:
  # De hora em hora, sem Claude e sem notebook: é exatamente quando o notebook para que isto precisa
  # rodar. Quem decide se avisa é /api/vigia (functions/_vigia.js). Minuto quebrado pelo mesmo motivo
  # do bling-notas.yml: em hora cheia o GitHub enfileira tudo junto.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch: {}
concurrency:
  group: vigia
  cancel-in-progress: false
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          curl -sS --fail-with-body --max-time 60 -X POST -H "X-VC-Token: $VC_API_TOKEN" https://vistaconecte.pages.dev/api/vigia
        env:
          VC_API_TOKEN: ${{ secrets.VC_API_TOKEN }}
